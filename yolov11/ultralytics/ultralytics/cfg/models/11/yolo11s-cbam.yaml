# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs and CBAM attention.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, CBAM, []] # 5 (CBAM after Layer 4, P3 output)
  - [-1, 1, Conv, [512, 3, 2]] # 6
  - [-1, 2, C3k2, [512, True]] # 7
  - [-1, 1, CBAM, []] # 8 (CBAM after Layer 6/7, P4 output)
  - [-1, 1, Conv, [1024, 3, 2]] # 9
  - [-1, 2, C3k2, [1024, True]] # 10
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12
  - [-1, 1, CBAM, []] # 13 (CBAM after Layer 10/12, P5 output)

# YOLO11n-CBAM head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 8], 1, Concat, [1]] # 15 (cat backbone P4 output)
  - [-1, 2, C3k2, [512, False]] # 16 (P4_td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 5], 1, Concat, [1]] # 18 (cat backbone P3 output)
  - [-1, 2, C3k2, [256, False]] # 19 (P3_out)

  - [-1, 1, Conv, [256, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 (cat intermediate P4_td)
  - [-1, 2, C3k2, [512, False]] # 22 (P4_out)

  - [-1, 1, Conv, [512, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 (cat backbone P5 output)
  - [-1, 2, C3k2, [1024, True]] # 25 (P5_out)

  - [[19, 22, 25], 1, Detect, [nc]] # 26 (Detect P3, P4, P5)
