# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs and BiFPN weighted neck.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n-BiFPN head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, BiFPN_Concat, [1, 2]] # 12 (cat P5_up with P4_in)
  - [-1, 2, C3k2, [512, False]] # 13 (P4_td)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, BiFPN_Concat, [1, 2]] # 15 (cat P4_up with P3_in)
  - [-1, 2, C3k2, [256, False]] # 16 (P3_out)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13, 6], 1, BiFPN_Concat, [1, 3]] # 18 (cat P3_down, P4_td, and backbone P4_in)
  - [-1, 2, C3k2, [512, False]] # 19 (P4_out)

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, BiFPN_Concat, [1, 2]] # 21 (cat P4_down with P5_in)
  - [-1, 2, C3k2, [1024, True]] # 22 (P5_out)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
